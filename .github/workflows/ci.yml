name: Demo checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Retain browser reports, screenshots, and video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-browser-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload the tested application
        uses: actions/upload-artifact@v4
        with:
          name: guardian-build
          path: |
            dist/
            dist-server/
            docs/
            package.json
            package-lock.json
          retention-days: 14
