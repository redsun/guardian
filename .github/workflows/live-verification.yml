name: Verify live testnet position

on:
  workflow_dispatch:
    inputs:
      address:
        description: Public testnet address (leave blank for the configured reviewer)
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read and validate the public testnet position
        env:
          REVIEW_ADDRESS: ${{ inputs.address }}
        run: npm run verify:live -- --capture
      - name: Upload verified snapshot and provenance
        uses: actions/upload-artifact@v4
        with:
          name: verified-testnet-snapshot
          path: |
            docs/evidence/testnet-snapshot.json
            docs/evidence/verification.json
          if-no-files-found: error
          retention-days: 30
